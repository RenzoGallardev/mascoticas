<!DOCTYPE html>
<!--
  RESUMEN: Vista única (HTML) de todo Mascoticas. Contiene todas las pantallas (Login, Menú, Clientes, Mascotas, Empleados, Citas y Notificaciones).

  ARCHIVO:  public/mascoticas.html
  CAPA MVC: Vista (interfaz gráfica unificada)
  SU CÓDIGO: mascoticas.js (ConexionBack, Validador* y Vista*)
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mascoticas</title>
  <link rel="stylesheet" href="comun/estilos.css">
</head>
<body>
  <!-- Barra superior compartida (se oculta en el Login) -->
  <header id="encabezado" hidden></header>

  <main>

    <!-- ==================== VISTA: INICIO DE SESIÓN ==================== -->
    <div id="vista-login" class="vista" hidden>
      <section class="login">
        <img src="imagenes/logo.jpg" alt="Mascoticas">
        <h1>Iniciar sesión</h1>
        <form id="formLogin">
          <label>Usuario <input name="usuario"></label>
          <label>Clave   <input name="clave" type="password"></label>
          <div class="botones">
            <button type="button" class="principal" onclick="vistaLogin.entrar()">Entrar</button>
          </div>
        </form>
      </section>
    </div>

    <!-- ==================== VISTA: MENÚ PRINCIPAL ==================== -->
    <div id="vista-menu" class="vista" hidden>
      <h1 id="bienvenida"></h1>
      <div class="menu">
        <!-- "solo-secretaria": estos botones se esconden si entra un veterinario -->
        <a href="#clientes" class="solo-secretaria" onclick="navegar('clientes'); return false;">Clientes</a>
        <a href="#mascotas" onclick="navegar('mascotas'); return false;">Mascotas</a>
        <a href="#empleados" onclick="navegar('empleados'); return false;">Empleados</a>
        <a href="#citas" onclick="navegar('citas'); return false;">Citas</a>
        <a href="#notificaciones" class="solo-secretaria" onclick="navegar('notificaciones'); return false;">Notificaciones</a>
      </div>
    </div>

    <!-- ==================== VISTA: CLIENTES (Renzo Gallardo) ==================== -->
    <div id="vista-clientes" class="vista" hidden>
      <h1>Gestión de Clientes</h1>

      <!-- Crear cliente -->
      <section id="seccionFormClientes" hidden>
        <h2>Registrar cliente</h2>
        <form id="formClientes">
          <label>Cédula *            <input name="cedula"></label>
          <label>Teléfono *          <input name="telefono"></label>
          <label>Nombre *            <input name="nombre"></label>
          <label>Apellido *          <input name="apellido"></label>
          <label>Correo              <input name="correo"></label>
          <label>Usuario de Telegram <input name="telegram" placeholder="@usuario"></label>
          <label>Dirección           <input name="direccion"></label>
          <div class="botones">
            <button type="button" class="principal" onclick="vistaClientes.guardar()">OK</button>
            <button type="button" onclick="salir('seccionFormClientes')">Salir</button>
          </div>
        </form>
      </section>

      <!-- Consultar cliente -->
      <section>
        <div class="barra">
          <input id="buscarClientes" placeholder="Buscar por cédula, nombre o apellido">
          <button onclick="vistaClientes.consultar()">Buscar</button>
          <button class="principal" onclick="mostrarFormulario('seccionFormClientes', 'formClientes')">+ Crear cliente</button>
        </div>
        <table id="tablaClientes"></table>
      </section>
    </div>

    <!-- ==================== VISTA: MASCOTAS (Ian Carmona) ==================== -->
    <div id="vista-mascotas" class="vista" hidden>
      <h1>Gestión de Mascotas</h1>

      <!-- Registrar mascota -->
      <section id="seccionFormMascotas" hidden>
        <h2>Registrar mascota</h2>
        <form id="formMascotas">
          <label>Buscar dueño <input id="buscarDuenoMascotas" placeholder="Escriba cédula o nombre" oninput="filtrarLista('buscarDuenoMascotas', 'selectDuenoMascotas')"></label>
          <label>Dueño *   <select name="clienteId" id="selectDuenoMascotas"></select></label>
          <label>Nombre *  <input name="nombre"></label>
          <label>Especie * <input name="especie" placeholder="Perro, gato..."></label>
          <label>Raza      <input name="raza"></label>
          <label>Sexo
            <select name="sexo">
              <option value="">-- Seleccione --</option>
              <option>Macho</option>
              <option>Hembra</option>
            </select>
          </label>
          <label>Fecha de nacimiento <input name="fechaNacimiento" type="date"></label>
          <div class="botones">
            <button type="button" class="principal" onclick="vistaMascotas.guardar()">OK</button>
            <button type="button" onclick="salir('seccionFormMascotas')">Salir</button>
          </div>
        </form>
      </section>

      <!-- Consultar mascota -->
      <section>
        <div class="barra">
          <input id="buscarMascotas" placeholder="Buscar por nombre o especie">
          <button onclick="vistaMascotas.consultar()">Buscar</button>
          <button class="principal" id="botonNuevoMascotas" onclick="vistaMascotas.abrirFormulario()">+ Registrar mascota</button>
        </div>
        <table id="tablaMascotas"></table>
      </section>
    </div>

    <!-- ==================== VISTA: EMPLEADOS (Ángel Araujo) ==================== -->
    <div id="vista-empleados" class="vista" hidden>
      <h1>Gestión de Empleados</h1>

      <!-- Crear empleado -->
      <section id="seccionFormEmpleados" hidden>
        <h2>Crear empleado</h2>
        <form id="formEmpleados">
          <label>Cédula *   <input name="cedula"></label>
          <label>Rol *
            <select name="rol">
              <option value="">-- Seleccione --</option>
              <option value="secretaria">Secretaria</option>
              <option value="veterinario">Veterinario</option>
            </select>
          </label>
          <label>Nombre *   <input name="nombre"></label>
          <label>Apellido * <input name="apellido"></label>
          <label>Teléfono   <input name="telefono"></label>
          <label>Correo     <input name="correo"></label>
          <label>Usuario *  <input name="usuario"></label>
          <label>Clave *    <input name="clave" type="password"></label>
          <div class="botones">
            <button type="button" class="principal" onclick="vistaEmpleados.guardar()">OK</button>
            <button type="button" onclick="salir('seccionFormEmpleados')">Salir</button>
          </div>
        </form>
      </section>

      <!-- Consultar empleado -->
      <section>
        <div class="barra">
          <select id="filtroRolEmpleados">
            <option value="">Todos los roles</option>
            <option value="secretaria">Secretaria</option>
            <option value="veterinario">Veterinario</option>
          </select>
          <button onclick="vistaEmpleados.consultar()">Buscar</button>
          <button class="principal" id="botonNuevoEmpleados" onclick="mostrarFormulario('seccionFormEmpleados', 'formEmpleados')">+ Crear empleado</button>
        </div>
        <table id="tablaEmpleados"></table>
      </section>
    </div>

    <!-- ==================== VISTA: CITAS (Mouriss ElJawich) ==================== -->
    <div id="vista-citas" class="vista" hidden>
      <h1>Gestión de Citas</h1>

      <!-- Crear cita médica -->
      <section id="seccionFormCitas" hidden>
        <h2>Crear Cita Médica</h2>
        <form id="formCitas">
          <label>Buscar cliente <input id="buscarClienteCitas" placeholder="Escriba cédula o nombre" oninput="filtrarLista('buscarClienteCitas', 'selectClienteCitas')"></label>
          <label>Cliente *     <select name="clienteId" id="selectClienteCitas" onchange="vistaCitas.cargarMascotasDelCliente()"></select></label>
          <label>Mascota *     <select name="mascotaId" id="selectMascotaCitas"></select></label>
          <label>Veterinario * <select name="veterinarioId" id="selectVeterinarioCitas"></select></label>
          <label>Tipo de consulta *
            <select name="tipo">
              <option value="">-- Seleccione --</option>
              <option>General</option>
              <option>Control</option>
              <option>Vacunación</option>
              <option>Especialidad</option>
            </select>
          </label>
          <label>Fecha * <input name="fecha" type="date"></label>
          <label>Hora * (horario laboral)
            <select name="hora">
              <option value="">-- Seleccione --</option>
              <option value="08:00">8:00 am</option>
              <option value="09:00">9:00 am</option>
              <option value="10:00">10:00 am</option>
              <option value="11:00">11:00 am</option>
              <option value="14:00">2:00 pm</option>
              <option value="15:00">3:00 pm</option>
              <option value="16:00">4:00 pm</option>
              <option value="17:00">5:00 pm</option>
            </select>
          </label>
          <div class="botones">
            <button type="button" class="principal" onclick="vistaCitas.guardar()">OK</button>
            <button type="button" onclick="salir('seccionFormCitas')">Salir</button>
          </div>
        </form>
      </section>

      <!-- Consultar citas del día -->
      <section>
        <div class="barra">
          <input id="fechaConsultaCitas" type="date">
          <button onclick="vistaCitas.consultar()">Ver citas del día</button>
          <button class="principal" id="botonNuevoCitas" onclick="vistaCitas.abrirFormulario()">+ Crear cita</button>
        </div>
        <table id="tablaCitas"></table>
      </section>
    </div>

    <!-- ==================== VISTA: NOTIFICACIONES (Niyerlin Muñoz) ==================== -->
    <div id="vista-notificaciones" class="vista" hidden>
      <h1>Gestión de Notificaciones</h1>

      <!-- Crear notificación -->
      <section id="seccionFormNotificaciones" hidden>
        <h2>Crear notificación</h2>
        <form id="formNotificaciones">
          <label>Buscar cliente <input id="buscarClienteNotificaciones" placeholder="Escriba cédula o nombre" oninput="filtrarLista('buscarClienteNotificaciones', 'selectClienteNotificaciones')"></label>
          <label>Cliente * <select name="clienteId" id="selectClienteNotificaciones" onchange="vistaNotificaciones.alElegirCliente()"></select></label>
          <label>Mascota * <select name="mascotaId" id="selectMascotaNotificaciones"></select></label>
          <label>Tipo de servicio *
            <select name="servicio">
              <option value="">-- Seleccione --</option>
              <option>Cita médica</option>
              <option>Peluquería</option>
            </select>
          </label>
          <label>Fecha * <input name="fecha" type="date"></label>
          <label>Hora *  <input name="hora" type="time"></label>
          <div class="botones">
            <button type="button" class="principal" onclick="vistaNotificaciones.guardar()">OK</button>
            <button type="button" onclick="salir('seccionFormNotificaciones')">Salir</button>
          </div>
        </form>
      </section>

      <!-- Consultar notificación -->
      <section>
        <div class="barra">
          <button onclick="vistaNotificaciones.consultar()">Actualizar lista</button>
          <button class="principal" onclick="vistaNotificaciones.abrirFormulario()">+ Crear notificación</button>
        </div>
        <table id="tablaNotificaciones"></table>
      </section>
    </div>

  </main>

  <script src="mascoticas.js"></script>
</body>
</html>
