<!DOCTYPE html>
<!--
  ARCHIVO: public/empleados/empleados.html
  QUÉ ES:  Interfaz "Gestión de Empleados"
           - Formulario "Crear empleado" (solo secretaria).
           - Tabla (HU Consultar empleado: secretaria y veterinario).
  AUTOR:   Ángel Araujo
  SU CÓDIGO: empleados.js
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Empleados · Mascoticas</title>
  <link rel="stylesheet" href="../comun/estilos.css">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <h1>Gestión de Empleados</h1>

    <!-- ===== CREAR EMPLEADO ===== -->
    <section id="seccionFormulario" hidden>
      <h2>Crear empleado</h2>
      <form id="formulario">
        <label>Cédula *   <input name="cedula"></label>
        <label>Rol *
          <select name="rol">
            <option value="">-- Seleccione --</option>
            <option value="secretaria">Secretaria</option>
            <option value="veterinario">Veterinario</option>
          </select>
        </label>
        <label>Nombre *   <input name="nombre"></label>
        <label>Apellido * <input name="apellido"></label>
        <label>Teléfono   <input name="telefono"></label>
        <label>Correo     <input name="correo"></label>
        <label>Usuario *  <input name="usuario"></label>
        <label>Clave *    <input name="clave" type="password"></label>
        <div class="botones">
          <button type="button" class="principal" onclick="guardarEmpleado()">OK</button>
          <button type="button" onclick="salir()">Salir</button>
        </div>
      </form>
    </section>

    <!-- ===== CONSULTAR EMPLEADO ===== -->
    <section>
      <div class="barra">
        <select id="filtroRol">
          <option value="">Todos los roles</option>
          <option value="secretaria">Secretaria</option>
          <option value="veterinario">Veterinario</option>
        </select>
        <button onclick="consultarEmpleados()">Buscar</button>
        <button class="principal" id="botonNuevo" onclick="mostrarFormulario('seccionFormulario', 'formulario')">+ Crear empleado</button>
      </div>
      <table id="tabla"></table>
    </section>
  </main>

  <script src="../comun/comun.js"></script>
  <script src="empleados.js"></script>
</body>
</html>
