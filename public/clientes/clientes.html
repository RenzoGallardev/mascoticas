<!DOCTYPE html>
<!--
  RESUMEN: Lo que se ve: el formulario y la tabla de clientes. Sus botones llaman a funciones de clientes.js.

  ARCHIVO: public/clientes/clientes.html
  QUÉ ES:  Interfaz "Gestión de Clientes"
           - Formulario "Registrar cliente" (HU Crear cliente/dueño). Oculto hasta presionar "+ Crear cliente".
           - Buscador y tabla (HU Consultar cliente).
  AUTOR:   Renzo Gallardo
  SU CÓDIGO: clientes.js  (cada botón llama a una función de ese archivo con "onclick")
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clientes · Mascoticas</title>
  <link rel="stylesheet" href="../comun/estilos.css">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <h1>Gestión de Clientes</h1>

    <!-- ===== CREAR CLIENTE ===== -->
    <section id="seccionFormulario" hidden>
      <h2>Registrar cliente</h2>
      <form id="formulario">
        <label>Cédula *            <input name="cedula"></label>
        <label>Teléfono *          <input name="telefono"></label>
        <label>Nombre *            <input name="nombre"></label>
        <label>Apellido *          <input name="apellido"></label>
        <label>Correo              <input name="correo"></label>
        <label>Usuario de Telegram <input name="telegram" placeholder="@usuario"></label>
        <label>Dirección           <input name="direccion"></label>
        <div class="botones">
          <button type="button" class="principal" onclick="guardarCliente()">OK</button>
          <button type="button" onclick="salir()">Salir</button>
        </div>
      </form>
    </section>

    <!-- ===== CONSULTAR CLIENTE ===== -->
    <section>
      <div class="barra">
        <input id="textoBuscar" placeholder="Buscar por cédula, nombre o apellido">
        <button onclick="consultarClientes()">Buscar</button>
        <button class="principal" onclick="mostrarFormulario('seccionFormulario', 'formulario')">+ Crear cliente</button>
      </div>
      <table id="tabla"></table>
    </section>
  </main>

  <script src="../comun/comun.js"></script>
  <script src="clientes.js"></script>
</body>
</html>
