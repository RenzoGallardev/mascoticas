<!DOCTYPE html>
<!--
  ARCHIVO: front/citas/citas.html
  QUÉ ES:  Interfaz "Gestión de Citas"
           - Formulario "Crear Cita Médica" (solo secretaria).
           - Citas de un día (HU Consultar citas del día: secretaria y veterinario).
  AUTOR:   Mouriss ElJawich
  SU CÓDIGO: citas.js
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Citas · Mascoticas</title>
  <link rel="stylesheet" href="../comun/estilos.css">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <h1>Gestión de Citas</h1>

    <!-- ===== CREAR CITA MÉDICA ===== -->
    <section id="seccionFormulario" hidden>
      <h2>Crear Cita Médica</h2>
      <form id="formulario">
        <!-- onchange: al elegir un cliente se cargan SOLO sus mascotas -->
        <label>Cliente *     <select name="clienteId" id="selectCliente" onchange="cargarMascotasDelCliente()"></select></label>
        <label>Mascota *     <select name="mascotaId" id="selectMascota"></select></label>
        <label>Veterinario * <select name="veterinarioId" id="selectVeterinario"></select></label>
        <label>Tipo de consulta *
          <select name="tipo">
            <option value="">-- Seleccione --</option>
            <option>General</option>
            <option>Control</option>
            <option>Vacunación</option>
            <option>Especialidad</option>
          </select>
        </label>
        <label>Fecha * <input name="fecha" type="date"></label>
        <label>Hora * (horario laboral)
          <select name="hora">
            <option value="">-- Seleccione --</option>
            <option value="08:00">8:00 am</option>
            <option value="09:00">9:00 am</option>
            <option value="10:00">10:00 am</option>
            <option value="11:00">11:00 am</option>
            <option value="14:00">2:00 pm</option>
            <option value="15:00">3:00 pm</option>
            <option value="16:00">4:00 pm</option>
            <option value="17:00">5:00 pm</option>
          </select>
        </label>
        <div class="botones">
          <button type="button" class="principal" onclick="guardarCita()">OK</button>
          <button type="button" onclick="salir()">Salir</button>
        </div>
      </form>
    </section>

    <!-- ===== CONSULTAR CITAS DEL DÍA ===== -->
    <section>
      <div class="barra">
        <input id="fechaConsulta" type="date">
        <button onclick="consultarCitas()">Ver citas del día</button>
        <button class="principal" id="botonNuevo" onclick="abrirFormularioCita()">+ Crear cita</button>
      </div>
      <table id="tabla"></table>
    </section>
  </main>

  <script src="../comun/comun.js"></script>
  <script src="citas.js"></script>
</body>
</html>
